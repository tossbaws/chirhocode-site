name: Website

# Publishes site/ (the Chi Rho Code LLC website) to GitHub Pages. Pages must
# be set to deploy from "GitHub Actions" in the repository settings; until
# then the deploy fails and nothing is published (docs/MAINTENANCE.md). The
# site is plain static files, so there's no build step: site/ is uploaded
# as it is.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # One deployment at a time; a newer one waits rather than cancelling one
    # that's already publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the site
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 tools/check_site.py

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
